name: df_go2
config:
  _target_: dflex.envs.Go2VelocityEnv
  render: ${general.render}
  device: ${general.device}
  num_envs: 128
  stochastic_init: False
  no_grad: ??? # decided based on algorithm
  episode_length: 1000
  MM_caching_frequency: 16
  early_termination: True
  nan_state_fix: True
  termination_height: 0.15
  action_penalty: -5e-3
  up_rew_scale: 0.1
  heading_rew_scale: 1.0
  heigh_rew_scale: 1.0
  wandb: False

  contact:
    ke: 1e4  # Nominal stiffness for elastic contact
    kd: 8e3  # Nominal damping for elastic contact
    kf: 1e3  # Nominal friction for elastic contact
    mu: 0.65  # Nominal friction coefficient for elastic contact

mujoco:
  config:
    # Sim-to-sim transfer to mujoco
    _target_: sim2mujoco.envs.Go2VelocityMujocoEnv
    alg: ${alg.name}
    render: True
    num_games: 10
    num_envs: 1
    device: ${general.device}

shac:
  actor_lr: 2e-3
  critic_lr: 2e-3
  max_epochs: 3000
  save_interval: 500
  target_critic_alpha: 0.99
  actor_mlp:
    units: [256, 128]
#    units: [400, 200, 100]
  critic_mlp:
    units: [64, 64]
#    units: [400, 200, 100]

ppo:
  max_epochs: 500
  lr: 1e-3
  minibatch_size: 24576
  num_actors: 4096
  horizon_length: 24
  save_frequency: 100
  save_best_after: 100
  actor_mlp:
    units: [128, 128, 128]
  scale_value: 0.6
  kl_threshold: 0.01
  critic_coef: 2.0
  bounds_loss_coef: 0.0

sac:
  max_epochs: 5000
  batch_size: 2048
  num_actors: 64
  save_frequency: 500
  save_best_after: 500
  actor_critic_mlp:
    units: [512, 256]

svg:
  num_train_steps: 1e7
  replay_buffer_capacity: 1e6
